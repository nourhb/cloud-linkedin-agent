<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CloudLinkedIn Agent — Monitor</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header class="top">
      <div>
        <p class="eyebrow">CloudLinkedIn Agent</p>
        <h1>Monitor</h1>
      </div>
      <div class="top-actions">
        <p id="updated" class="muted">Loading…</p>
        <button id="refresh" type="button">Refresh</button>
      </div>
    </header>

    <section class="status-banner" id="banner">
      <strong id="banner-status">Checking last run…</strong>
      <span id="banner-detail"></span>
    </section>

    <section class="stats" id="stats"></section>

    <section class="grid">
      <article class="panel">
        <h2>Published posts</h2>
        <div id="posts" class="stack"></div>
      </article>
      <article class="panel">
        <h2>Recent runs</h2>
        <div id="runs" class="stack"></div>
      </article>
    </section>

    <section class="panel">
      <h2>Topic cooldown</h2>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Topic</th>
              <th>Category</th>
              <th>Last used</th>
              <th>Remaining</th>
            </tr>
          </thead>
          <tbody id="topics"></tbody>
        </table>
      </div>
    </section>

    <footer>
      <p class="muted">Read-only view of <code>data/*.json</code>. Secrets are never shown. Pull from GitHub after a daily run to see the latest history.</p>
    </footer>
    <script src="/app.js"></script>
  </body>
</html>
