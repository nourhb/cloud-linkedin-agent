name: Manual Test Run

# Manual-only workflow for testing the pipeline (SPEC section 28: "Never
# force the first test to publish directly"). Defaults to dry-run. Does NOT
# run on a schedule and does NOT trigger on push.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'dry-run: generate + validate only. publish: run the full pipeline and publish for real (or via MOCK_LINKEDIN if configured).'
        type: choice
        required: true
        default: 'dry-run'
        options:
          - dry-run
          - publish

permissions:
  contents: write

jobs:
  manual-run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NODE_ENV: production
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-2.5-flash' }}
      LINKEDIN_CLIENT_ID: ${{ secrets.LINKEDIN_CLIENT_ID }}
      LINKEDIN_CLIENT_SECRET: ${{ secrets.LINKEDIN_CLIENT_SECRET }}
      LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
      LINKEDIN_API_VERSION: ${{ vars.LINKEDIN_API_VERSION || '202609' }}
      POST_TIMEZONE: ${{ vars.POST_TIMEZONE || 'America/Toronto' }}
      MOCK_LINKEDIN: ${{ vars.MOCK_LINKEDIN || 'false' }}
      MOCK_GEMINI: ${{ vars.MOCK_GEMINI || 'false' }}
      POSTS_PER_DAY: ${{ vars.POSTS_PER_DAY || '1' }}
      MAX_POSTS_PER_DAY: ${{ vars.MAX_POSTS_PER_DAY || '1' }}
      MAX_AI_REQUESTS_PER_RUN: ${{ vars.MAX_AI_REQUESTS_PER_RUN || '3' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Generate (dry-run)
        if: inputs.mode == 'dry-run'
        run: npm run generate:dry

      - name: Generate and publish
        if: inputs.mode == 'publish'
        run: npm run publish

      - name: Commit and push updated history
        if: inputs.mode == 'publish'
        run: |
          git config user.name "CloudLinkedIn Agent"
          git config user.email "cloudlinkedin-agent@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No history changes to commit."
          else
            git commit -m "chore: update content history (manual run) [skip ci]"
            git push
          fi
